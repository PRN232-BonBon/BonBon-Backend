name: Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bonbon-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prn232-bonbon/bonbon-backend

jobs:
  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production API
    needs: build-and-push
    runs-on:
      - self-hosted
      - Linux
      - X64
      - bonbon-prod
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE || '/opt/bonbon/BonBon-Backend/.env' }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'http://127.0.0.1:8080/health' }}

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate server configuration
        shell: bash
        run: |
          test -f "$DEPLOY_ENV_FILE"
          test "$(stat -c '%a' "$DEPLOY_ENV_FILE")" = "600"

      - name: Pull and deploy API
        shell: bash
        run: |
          export API_IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker compose \
            --project-name bonbon \
            --env-file "$DEPLOY_ENV_FILE" \
            --file compose.yaml \
            --file compose.production.yaml \
            pull api
          docker compose \
            --project-name bonbon \
            --env-file "$DEPLOY_ENV_FILE" \
            --file compose.yaml \
            --file compose.production.yaml \
            up --detach --no-deps --no-build api

      - name: Verify API health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$API_HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 bonbon-api-1
          exit 1
