name: Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bonbon-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prn232-bonbon/bonbon-backend

jobs:
  build-admin:
    name: Build admin portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v6
        with:
          repository: PRN232-BonBon/BonBon-Frontend
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build independent admin entry
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build:admin
      - name: Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: bonbon-admin
          path: dist-admin/
          retention-days: 7

  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production API
    needs: [build-and-push, build-admin]
    runs-on:
      - self-hosted
      - Linux
      - X64
      - bonbon-prod
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE || '/opt/bonbon/BonBon-Backend/.env' }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'http://127.0.0.1:8080/health' }}

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Download admin portal
        uses: actions/download-artifact@v4
        with:
          name: bonbon-admin
          path: admin-build

      - name: Publish admin portal files
        shell: bash
        env:
          ADMIN_PORTAL_PATH: ${{ vars.ADMIN_PORTAL_PATH || '/opt/bonbon/admin' }}
        run: |
          mkdir -p "$ADMIN_PORTAL_PATH/assets"
          cp -a admin-build/assets/. "$ADMIN_PORTAL_PATH/assets/"
          install -m 644 admin-build/admin.html "$ADMIN_PORTAL_PATH/admin.html.next"
          mv "$ADMIN_PORTAL_PATH/admin.html.next" "$ADMIN_PORTAL_PATH/admin.html"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate server configuration
        shell: bash
        run: |
          test -f "$DEPLOY_ENV_FILE"
          test "$(stat -c '%a' "$DEPLOY_ENV_FILE")" = "600"

      - name: Pull and deploy API
        shell: bash
        run: |
          export API_IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker compose \
            --project-name bonbon \
            --env-file "$DEPLOY_ENV_FILE" \
            --file compose.yaml \
            --file compose.production.yaml \
            pull api
          docker compose \
            --project-name bonbon \
            --env-file "$DEPLOY_ENV_FILE" \
            --file compose.yaml \
            --file compose.production.yaml \
            up --detach --no-deps --no-build api

      - name: Verify API health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$API_HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 bonbon-api-1
          exit 1
